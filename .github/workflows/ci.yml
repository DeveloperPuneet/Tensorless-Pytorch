name: CI

# Runs on every push and pull request. Previously the only workflow in
# this repo was python-publish.yml, which runs solely on a GitHub
# Release -- meaning no PR or push to `main` ever actually ran the test
# suite, a linter, or a packaging check before this.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff>=0.6
      - name: Lint
        run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev/optional dependencies
        run: pip install -e ".[dev,yaml]"
      - name: Run tests with coverage
        run: pytest --cov=tensorless --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  packaging:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate package metadata
        run: twine check dist/*
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
      - name: Smoke-test the installed package (import + CLI + packaged data file)
        run: |
          /tmp/wheel-env/bin/python -c "
          import tensorless as tl
          import importlib.resources as res
          # The built wheel must actually contain the non-.py data file
          # tensorless/data/english_grammar.txt ships alongside -- this is
          # exactly the kind of thing [tool.setuptools.package-data] gets
          # silently wrong if MANIFEST.in/package-data drift from what's
          # really on disk, and a plain 'pytest' run (which imports from
          # the source tree, not the installed wheel) would never catch it.
          text = res.files('tensorless.data').joinpath('english_grammar.txt').read_text()
          assert len(text) > 0, 'packaged data file is empty or missing'
          print('tensorless', tl.__version__, 'installed OK, package data present')
          "
          /tmp/wheel-env/bin/tensorless --help
